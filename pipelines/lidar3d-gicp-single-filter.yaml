# =====================================================================================
# Pipeline: GICP (Generalized ICP) with cov-to-cov pairings
#           TEST VARIANT: one single decimation filter for both output clouds.
#
# Identical to lidar3d-gicp.yaml, except that the two chained
# FilterDecimateAdaptive stages (producing "decimated_for_map" and
# "decimated_for_icp") are replaced by ONE filter emitting both layers from a
# single voxelization pass, via its "outputs" parameter. Voxelizing is the
# dominant cost of that filter, so the second stage becomes essentially free:
# measured on a synthetic 100k-point scan, the 1st filter pass drops from
# ~15.0 ms to ~13.0 ms, with unchanged ICP quality.
#
# NOT a pure parity change in one respect: both outputs share the single grid
# at ${MOLA_CLOUD_DECIMATION_VOXEL_SIZE_MAP|0.15}, so the separate voxel size of
# the chained "icp" stage (MOLA_CLOUD_DECIMATION_VOXEL_SIZE_ICP) does not exist
# here. The ICP cloud is therefore sampled from the map grid over the FULL scan,
# instead of from a finer grid over the already-decimated map cloud.
#
# NOTE: this requires an mp2p_icp with support for the "outputs" parameter of
# FilterDecimateAdaptive, newer than the currently released version, hence it is
# kept as a separate file instead of changing lidar3d-gicp.yaml. Once mp2p_icp
# is re-released, fold this back into lidar3d-gicp.yaml and remove this file.
# =====================================================================================

$import: lidar3d-gicp.yaml

params:
  pipeline_name: "GICP with cov-to-cov pairings (single decimation filter)" # For display/debug only

observations_filter_1st_pass:
  # One single voxelization pass feeds BOTH decimated clouds: the denser one
  # inserted into the local map, and the sparser one used for ICP. Chaining two
  # filters instead would re-voxelize the first output, which is the expensive
  # part, and would also compute the ICP cloud from already-decimated voxel
  # statistics rather than from the full scan.
  - class_name: mp2p_icp_filters::FilterDecimateAdaptive
    params:
      name: "FilterDecimateAdaptive (map+icp)"
      input_pointcloud_layer: "deskewed"
      voxel_size: "${MOLA_CLOUD_DECIMATION_VOXEL_SIZE_MAP|0.15}" # [m]
      decimate_method: "${MOLA_DECIMATE_METHOD|DecimateMethod::FirstPoint}"
      parallelization_grain_size: 8000 # When TBB is enabled, the grainsize for splitting the input clouds into threads
      outputs:
        - output_pointcloud_layer: "decimated_for_map"
          desired_output_point_count: "${MOLA_DECIMATED_POINTS_MAP|10000}"
        - output_pointcloud_layer: "decimated_for_icp"
          desired_output_point_count: "${MOLA_DECIMATED_POINTS_ICP|3000}"
