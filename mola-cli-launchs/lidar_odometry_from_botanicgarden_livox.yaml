# -----------------------------------------------------------------------------
#                        SLAM system definition for MOLA
# This file defines:
# LiDAR odometry from the BotanicGarden dataset using the Livox AVIA sensor
# (/livox/lidar, livox_ros_driver/CustomMsg), read directly from its ROS 1
# ".bag" file via mola::Rosbag1Dataset (no ROS 1 install required).
#
# Dataset: BotanicGarden (https://github.com/robot-pesg/BotanicGarden)
# Sensor inventory of the "LIO" bag (confirmed with rosbag1-info):
#   /imu/data         sensor_msgs/Imu        Xsens MTi-680G, ~400 Hz (base_link)
#   /livox/lidar      livox_ros_driver/CustomMsg  Livox AVIA, ~10 Hz  <-- PRIMARY
#   /livox/imu        sensor_msgs/Imu        BMI088 (Livox built-in), ~200 Hz
#   /odom             nav_msgs/Odometry      wheel odometry, ~200 Hz
#   /velodyne_points  sensor_msgs/PointCloud2 Velodyne VLP-16, ~10 Hz (unused)
# NO GNSS topic in this bag: Xsens D-GNSS/INS hardware is not published.
#
# livox_ros_driver/CustomMsg is natively supported by mola_input_rosbag1:
# offset_time -> per-point timestamp, reflectivity -> intensity, line -> ring.
#
# Extrinsics: all fixed_sensor_pose values taken from
#   BotanicGarden/calib/extrinsics/calib_chain.yaml
# with the Xsens IMU (/imu/data) as base_link (T_xsens_* convention).
#   /livox/lidar : T_xsens_vlp16 * T_vlp16_livox  (cross-LiDAR chain)
#   /livox/imu   : T_xsens_gray0 * inv(T_bmi088_gray0)  (via camera chain;
#                   no direct bmi088<->xsens calibration is provided)
# There is no /tf or /tf_static in the bag, so use_fixed_sensor_pose is
# mandatory for all sensors.
#
# Usage:
#   export BOTANICGARDEN_LIO_BAG=$HOME/datasets/botanic/1018_00_LIO.bag
#   MOLA_DESKEW_METHOD=MotionCompensationMethod::IMU \
#   MOLA_IGNORE_NO_POINT_STAMPS=false \
#   MOLA_MIN_NEARBY_POSES_OCCUPIED=2 \
#   MOLA_SIMPLEMAP_MIN_NEARBY_POSES=2 \
#   MOLA_MIN_ROT_BETWEEN_MAP_UPDATES=10 \
#   MOLA_SIMPLEMAP_MIN_ROT=10 \
#   mola-cli $(ros2 pkg prefix mola_lidar_odometry)/share/mola_lidar_odometry/mola-cli-launchs/lidar_odometry_from_botanicgarden_livox.yaml
#
# MOLA_DESKEW_METHOD=MotionCompensationMethod::IMU enables true LIO deskewing:
#   the default (Linear) only uses the state-estimator's twist, not raw IMU
#   gyroscope readings. IMU-based deskewing is better for high-speed motion.
# MOLA_IGNORE_NO_POINT_STAMPS=false: Livox AVIA per-point timestamps come from
#   offset_time via mola_input_rosbag1's CustomMsg converter; this flag ensures
#   deskewing is not silently skipped if they are accidentally missing.
# MOLA_MIN_NEARBY_POSES_OCCUPIED=2 / MOLA_SIMPLEMAP_MIN_NEARBY_POSES=2:
#   The Livox AVIA uses a non-repetitive (solid-state) scan pattern: a single
#   frame does NOT cover the full FOV uniformly. Setting this to 2+ ensures that
#   at least 2 scans are stored from each location before moving on, so the
#   local map and simplemap are built from denser, more complete coverage.
#   For spinning lidars (e.g. VLP-16) the default of 1 is correct.
#
# Optional overrides:
#   BOTANICGARDEN_GT_BAG=$HOME/datasets/botanic/gt_1018_00_qnew.bag
#     -- also replays /gt_poses (not consumed by LidarOdometry; ground-truth
#        reference only)
#   MOLA_WITH_GUI=false        -- headless mode
#   MOLA_TIME_WARP=1.0         -- playback speed factor
#   MOLA_QUIT_ON_DATASET_END=true  -- exit when bag ends
# -----------------------------------------------------------------------------

modules:
  # =====================
  # MolaViz / MolaVizImGui
  # =====================
  - name: viz
    type: ${MOLA_GUI_MODULE|mola::MolaVizImGui}
    enabled: ${MOLA_WITH_GUI|true}
    verbosity_level: "${MOLA_VERBOSITY_MOLA_VIZ|INFO}"
    params:
      imgui_app_name: lo_botanicgarden_livox

  # =====================
  # Rosbag1Dataset (BotanicGarden)
  # =====================
  - name: dataset_input
    type: mola::Rosbag1Dataset
    verbosity_level: "${MOLA_VERBOSITY_ROSBAG1|INFO}"
    execution_rate: 50 # Hz
    quit_mola_app_on_dataset_end: ${MOLA_QUIT_ON_DATASET_END|true}

    gui_preview_sensors:
      - raw_sensor_label: lidar
        decimation: 1
        enabled: ${MOLA_WITH_GUI|true}
        win_pos: 5 5 400 400

    params:
      rosbag_filename:
        - ${BOTANICGARDEN_LIO_BAG}
        - ${BOTANICGARDEN_GT_BAG|}

      base_link_frame_id: xsens
      time_warp_scale: ${MOLA_TIME_WARP|1.0}
      start_paused: ${MOLA_DATASET_START_PAUSED|false}

      ground_truth_topic: /gt_poses

      sensors:
        - topic: /imu/data   # Xsens MTi-680G, ~400 Hz: this IS base_link
          type: CObservationIMU
          sensorLabel: imu
          fixed_sensor_pose: "0 0 0 0 0 0"
          use_fixed_sensor_pose: true

        - topic: /livox/lidar   # Livox AVIA (livox_ros_driver/CustomMsg), ~10 Hz
          type: CObservationPointCloud
          sensorLabel: lidar
          fixed_sensor_pose: "0.1369218 0.0011730 -0.0076735 -0.235134 -0.506113 -0.294598" # T_xsens_vlp16 * T_vlp16_livox
          use_fixed_sensor_pose: true

        - topic: /livox/imu   # BMI088 (Livox built-in), ~200 Hz
          type: CObservationIMU
          sensorLabel: imu_livox
          fixed_sensor_pose: "0.0850406 -0.0366670 0.0273713 -0.222559 0.317378 0.494650" # T_xsens_gray0 * inv(T_bmi088_gray0)
          use_fixed_sensor_pose: true

        - topic: /odom   # Wheel odometry, ~200 Hz
          type: CObservationOdometry
          sensorLabel: odom_wheels

        - topic: /gt_poses   # Ground truth (only if BOTANICGARDEN_GT_BAG is set)
          type: CObservationRobotPose
          sensorLabel: ground_truth
          is_optional: true

  # =====================
  # LidarOdometry
  # =====================
  - name: lidar_odom
    type: mola::LidarOdometry
    verbosity_level: "${MOLA_VERBOSITY_MOLA_LO|INFO}"
    raw_data_source: "dataset_input"
    params: "${MOLA_ODOMETRY_PIPELINE_YAML|../pipelines/lidar3d-default.yaml}"

  # =====================
  # State Estimation
  # =====================
  - name: state_estimation
    type: "${MOLA_STATE_ESTIMATOR|mola::state_estimation_simple::StateEstimationSimple}"
    verbosity_level: "${MOLA_VERBOSITY_MOLA_STATE_ESTIMATOR|INFO}"
    raw_data_source: "dataset_input"
    params: "${MOLA_STATE_ESTIMATOR_YAML|../state-estimator-params/state-estimation-simple.yaml}"
